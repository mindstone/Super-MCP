name: Secret scan

# Scans everything a pull request's commits add for credentials, so none reaches
# this public repository. A required check on main.
#
# What fails: a credential TruffleHog proved live, or one it could not check
# because the provider did not answer, which could be a live key on a bad day.
# What does not: a credential the provider rejected, which is nearly always a
# fixture. The URI detector is left out of "could not check", because it tries
# every https://user:pass@host it sees and test fixtures use hosts that do not
# exist; a URI it proves live still fails.
# A false alarm: put trufflehog:ignore in a comment on that line.
#
# Safe for pull requests from forks: pull_request, not pull_request_target, so
# there are no secrets and the token is read-only. The PR's files are only read
# as data, never run.
#
# The scan reads each commit's file versions rather than using TruffleHog's git
# mode, whose walk stops early in a merge-heavy history and skips older commits.
# Findings print where they are, never the value: these logs are public.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Collect what the pull request's commits add
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          OUT=$RUNNER_TEMP/secret-scan
          zero=0000000000000000000000000000000000000000
          declare -A written=()
          mkdir -p "$OUT"
          git log --format=%B "$BASE..$HEAD" >"$OUT/commit-messages.txt"
          range=$(git rev-list "$BASE..$HEAD")
          for commit in $range; do
            # For a merge, -c lists only what the merge itself introduced.
            changes=$(mktemp)
            git diff-tree -r -c --root --raw -z --no-commit-id --no-abbrev "$commit" >"$changes"
            while IFS= read -r -d '' header && IFS= read -r -d '' path; do
              # A line break in a name could print a fake workflow command in the log.
              if [[ "$path" == *[$'\n\r']* ]]; then
                echo "::error::Commit $commit has a file name with a line break, which this scan refuses."
                exit 1
              fi
              stripped=${header##*:}
              parents=$((${#header} - ${#stripped}))
              read -r -a fields <<<"$stripped"
              mode=${fields[parents]}
              blob=${fields[2 * parents + 1]}
              if [[ "$blob" == "$zero" || "$mode" == 160000 || -n "${written[$blob]:-}" ]]; then
                continue
              fi
              written[$blob]=1
              destination=$OUT/$commit/$path
              mkdir -p "${destination%/*}"
              git cat-file blob "$blob" >"$destination"
            done <"$changes"
            rm -f "$changes"
          done
          echo "$(wc -w <<<"$range") commits, ${#written[@]} file versions to scan"

      - name: Run TruffleHog
        env:
          # Version 3.95.2, pinned by digest. Bump it on purpose.
          IMAGE: ghcr.io/trufflesecurity/trufflehog@sha256:49d1c4fbbc580aac487ac7cb0517bb085826bd352d7578d62bb4c0c6b7205075
        run: |
          set -euo pipefail
          OUT=$RUNNER_TEMP/secret-scan
          found=$RUNNER_TEMP/found.json
          log=$RUNNER_TEMP/trufflehog.log
          docker pull --quiet "$IMAGE" >/dev/null
          docker run --rm -v "$OUT:/scan:ro" "$IMAGE" filesystem /scan \
            --results=verified,unknown --json --no-update --fail-on-scan-errors >"$found" 2>"$log" || {
            echo "::error::TruffleHog did not finish (exit $?), so this pull request is not known to be clean."
            exit 1
          }
          # TruffleHog skips a file it cannot process, logs an error and exits 0.
          if grep -q '"level":"error"' "$log" || ! grep -q '"msg":"finished scanning"' "$log"; then
            echo "::error::TruffleHog logged an error or stopped early, so this pull request is not known to be clean."
            exit 1
          fi
          findings=$(jq -r '
            select(.Verified or .DetectorName != "URI")
            | (.SourceMetadata.Data.Filesystem.file | ltrimstr("/scan/") | gsub("[^A-Za-z0-9._/-]"; "_") | split("/")) as $p
            | "::error::\(.DetectorName) credential, \(if .Verified then "proved live" else "could not be checked" end): "
              + "\(if ($p | length) > 1 then "commit \($p[0][0:12]) file \($p[1:] | join("/"))" else $p[0] end) line \(.SourceMetadata.Data.Filesystem.line // 0)"
          ' "$found")
          if [[ -n "$findings" ]]; then
            echo "$findings"
            echo "::error::Revoke the credential, then remove it from the branch's history; a later commit deleting it is not enough. If it is not a real credential, put trufflehog:ignore in a comment on that line."
            exit 1
          fi
          echo "No live or uncheckable credentials found."
